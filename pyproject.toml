[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nadt"
version = "1.12.1"
description = "Vendor-neutral network device zero-touch provisioning tool (DHCP option 66/67 + TFTP, Huawei/Cisco/generic presets)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yata-Datacom" }]
keywords = ["ztp", "zero-touch-provisioning", "dhcp", "tftp", "easydeploy", "huawei", "cisco", "automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: System :: Networking",
  "Topic :: System :: Systems Administration",
]
# 核心只用标准库；下列都是可选能力（函数内延迟 import，缺失时界面给提示而不是崩溃）
dependencies = []

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]          # 设备清单 xlsx / Excel 模板导入导出
dev = ["pytest>=8", "ruff>=0.6", "openpyxl>=3.1"]

[project.scripts]
nadt = "nadt:main"

[tool.setuptools]
py-modules = ["nadt"]

[tool.setuptools.package-data]
nadt = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"   # 不在仓库里留 .pytest_cache

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# 基线门禁：只拦「真错误」（语法错 / 未定义名 / 未使用变量），先能过，之后可按需收紧
select = ["E9", "F"]
